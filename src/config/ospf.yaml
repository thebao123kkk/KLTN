# ============================================================
# OSPF Configuration — Enterprise Network KLTN
# FRRouting (frr) daemon trong Mininet host
# ============================================================

# Tất cả router trong OSPF Area 0 (backbone)
ospf:
  process_id: 1
  area: 0
  hello_interval: 10        # giây
  dead_interval: 40         # giây
  reference_bandwidth: 1000 # Mbps (để cost tính đúng)

# Các "router" — thực ra là Mininet host chạy FRR
# Mỗi site có 1 router ảo nối vào CORE switch
routers:
  # ──────────────────────────────────────────
  # BL — Bảo Lộc (flat site, 1 router)
  # ──────────────────────────────────────────
  BL_GW:
    router_id: 10.10.99.1
    interfaces:
      # WAN uplink sang HCM (sẽ dùng ở Phase 9)
      wan0:
        ip: 192.168.10.1/30
        ospf_area: 0
        ospf_cost: 10
        description: "WAN link BL-HCM"
      # LAN interfaces (inter-VLAN, 1 sub-if/VLAN)
      vlan10:
        ip: 10.10.10.1/24
        ospf_area: 0
        ospf_passive: true
        description: "BL USER VLAN"
      vlan30:
        ip: 10.10.30.1/24
        ospf_area: 0
        ospf_passive: true
        description: "BL IoT VLAN"
      vlan35:
        ip: 10.10.35.1/24
        ospf_area: 0
        ospf_passive: true
        description: "BL CCTV VLAN"
      vlan50:
        ip: 10.10.50.1/24
        ospf_area: 0
        ospf_passive: true
        description: "BL WIFI VLAN"
      vlan99:
        ip: 10.10.99.1/24
        ospf_area: 0
        ospf_passive: true
        description: "BL MGMT VLAN"

  # ──────────────────────────────────────────
  # NT — Nha Trang (DIST01 là OSPF DR)
  # ──────────────────────────────────────────
  NT_DIST01:
    router_id: 10.20.10.2
    vrrp_priority: 110   # VRRP master
    interfaces:
      wan0:
        ip: 192.168.20.1/30
        ospf_area: 0
        ospf_cost: 10
        description: "WAN uplink NT"
      vlan110: { ip: 10.20.10.2/24, ospf_passive: true }
      vlan120: { ip: 10.20.20.2/24, ospf_passive: true }
      vlan130: { ip: 10.20.30.2/24, ospf_passive: true }
      vlan140: { ip: 10.20.40.2/24, ospf_passive: true }
      vlan150: { ip: 10.20.50.2/24, ospf_passive: true }
      vlan160: { ip: 10.20.60.2/24, ospf_passive: true }
      vlan170: { ip: 10.20.70.2/24, ospf_passive: true }
      vlan175: { ip: 10.20.75.2/24, ospf_passive: true }
      vlan180: { ip: 10.20.80.2/24, ospf_passive: true }
      vlan190: { ip: 10.20.90.2/24, ospf_passive: true }
      vlan199: { ip: 10.20.99.2/24, ospf_passive: true }
      # Link xuống NT-CORE
      link_core: { ip: 10.20.99.10/30, ospf_area: 0, ospf_cost: 1 }

  NT_DIST02:
    router_id: 10.20.10.3
    vrrp_priority: 100   # VRRP backup
    interfaces:
      vlan110: { ip: 10.20.10.3/24, ospf_passive: true }
      vlan120: { ip: 10.20.20.3/24, ospf_passive: true }
      vlan130: { ip: 10.20.30.3/24, ospf_passive: true }
      vlan140: { ip: 10.20.40.3/24, ospf_passive: true }
      vlan150: { ip: 10.20.50.3/24, ospf_passive: true }
      vlan160: { ip: 10.20.60.3/24, ospf_passive: true }
      vlan170: { ip: 10.20.70.3/24, ospf_passive: true }
      vlan175: { ip: 10.20.75.3/24, ospf_passive: true }
      vlan180: { ip: 10.20.80.3/24, ospf_passive: true }
      vlan190: { ip: 10.20.90.3/24, ospf_passive: true }
      vlan199: { ip: 10.20.99.3/24, ospf_passive: true }
      link_core: { ip: 10.20.99.14/30, ospf_area: 0, ospf_cost: 1 }

  # ──────────────────────────────────────────
  # HCM — Hồ Chí Minh (DIST01 là OSPF DR)
  # ──────────────────────────────────────────
  HCM_DIST01:
    router_id: 10.30.10.2
    vrrp_priority: 110
    interfaces:
      wan0:
        ip: 192.168.30.1/30
        ospf_area: 0
        ospf_cost: 10
        description: "WAN uplink HCM"
      vlan210: { ip: 10.30.10.2/24, ospf_passive: true }
      vlan220: { ip: 10.30.20.2/24, ospf_passive: true }
      vlan230: { ip: 10.30.30.2/24, ospf_passive: true }
      vlan240: { ip: 10.30.40.2/24, ospf_passive: true }
      vlan250: { ip: 10.30.50.2/24, ospf_passive: true }
      vlan260: { ip: 10.30.60.2/24, ospf_passive: true }
      vlan270: { ip: 10.30.70.2/24, ospf_passive: true }
      vlan280: { ip: 10.30.80.2/24, ospf_passive: true }
      vlan290: { ip: 10.30.90.2/24, ospf_passive: true }
      vlan295: { ip: 10.30.95.2/24, ospf_passive: true }
      vlan296: { ip: 10.30.96.2/24, ospf_passive: true }
      vlan297: { ip: 10.30.97.2/24, ospf_passive: true }
      vlan299: { ip: 10.30.99.2/24, ospf_passive: true }
      link_core: { ip: 10.30.99.10/30, ospf_area: 0, ospf_cost: 1 }

  HCM_DIST02:
    router_id: 10.30.10.3
    vrrp_priority: 100
    interfaces:
      vlan210: { ip: 10.30.10.3/24, ospf_passive: true }
      vlan220: { ip: 10.30.20.3/24, ospf_passive: true }
      vlan230: { ip: 10.30.30.3/24, ospf_passive: true }
      vlan240: { ip: 10.30.40.3/24, ospf_passive: true }
      vlan250: { ip: 10.30.50.3/24, ospf_passive: true }
      vlan260: { ip: 10.30.60.3/24, ospf_passive: true }
      vlan270: { ip: 10.30.70.3/24, ospf_passive: true }
      vlan280: { ip: 10.30.80.3/24, ospf_passive: true }
      vlan290: { ip: 10.30.90.3/24, ospf_passive: true }
      vlan295: { ip: 10.30.95.3/24, ospf_passive: true }
      vlan296: { ip: 10.30.96.3/24, ospf_passive: true }
      vlan297: { ip: 10.30.97.3/24, ospf_passive: true }
      vlan299: { ip: 10.30.99.3/24, ospf_passive: true }
      link_core: { ip: 10.30.99.14/30, ospf_area: 0, ospf_cost: 1 }

  # ──────────────────────────────────────────
  # DC — Data Center (Spine router)
  # ──────────────────────────────────────────
  DC_SPINE_GW:
    router_id: 10.100.99.1
    interfaces:
      wan0:
        ip: 192.168.40.1/30
        ospf_area: 0
        ospf_cost: 10
        description: "WAN uplink DC"
      vlan310: { ip: 10.100.10.1/24, ospf_passive: true }
      vlan320: { ip: 10.100.20.1/24, ospf_passive: true }
      vlan330: { ip: 10.100.30.1/24, ospf_passive: true }
      vlan340: { ip: 10.100.40.1/24, ospf_passive: true }
      vlan350: { ip: 10.100.50.1/24, ospf_passive: true }
      vlan360: { ip: 10.100.60.1/24, ospf_passive: true }

# WAN Interconnects (Phase 9 — placeholder for now)
# BL ─── 192.168.10.0/30 ─── HCM
# NT ─── 192.168.20.0/30 ─── HCM
# HCM ── 192.168.30.0/30 ─── DC
