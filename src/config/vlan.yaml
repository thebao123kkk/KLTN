      ip: 10.10.10.22/24
      gw: 10.10.10.1
      vlan: 10
    - name: BL_SAL03
      ip: 10.10.10.23/24
      gw: 10.10.10.1
      vlan: 10
    - name: BL_ACC01
      ip: 10.10.10.31/24
      gw: 10.10.10.1
      vlan: 10
    - name: BL_ACC02
      ip: 10.10.10.32/24
      gw: 10.10.10.1
      vlan: 10
    - name: BL_ACC03
      ip: 10.10.10.33/24
      gw: 10.10.10.1
      vlan: 10
    - name: BL_IT01
      ip: 10.10.10.41/24
      gw: 10.10.10.1
