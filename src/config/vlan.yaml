    - { name: NT_SAL02, ip: 10.20.20.12/24, gw: 10.20.20.1, vlan: 120 }
    - { name: NT_SAL03, ip: 10.20.20.13/24, gw: 10.20.20.1, vlan: 120 }
    # VLAN 130 ACCOUNTING
