      subnet: 10.20.40.0/24
      gateway: 10.20.40.1
    150:
      name: CUSTOMER
      subnet: 10.20.50.0/24
      gateway: 10.20.50.1
    160:
      name: IT
      subnet: 10.20.60.0/24
      gateway: 10.20.60.1
    170:
      name: IoT
      subnet: 10.20.70.0/24
      gateway: 10.20.70.1
