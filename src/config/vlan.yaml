    # VLAN 110 ADMIN
    - { name: NT_ADM01, ip: 10.20.10.11/24, gw: 10.20.10.1, vlan: 110 }
    - { name: NT_ADM02, ip: 10.20.10.12/24, gw: 10.20.10.1, vlan: 110 }
