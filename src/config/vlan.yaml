    - { name: NT_ACC02, ip: 10.20.30.12/24, gw: 10.20.30.1, vlan: 130 }
    - { name: NT_ACC03, ip: 10.20.30.13/24, gw: 10.20.30.1, vlan: 130 }
    # VLAN 140 HR
    - { name: NT_HR01, ip: 10.20.40.11/24, gw: 10.20.40.1, vlan: 140 }
    - { name: NT_HR02, ip: 10.20.40.12/24, gw: 10.20.40.1, vlan: 140 }
    - { name: NT_HR03, ip: 10.20.40.13/24, gw: 10.20.40.1, vlan: 140 }
    # VLAN 150 CUSTOMER
