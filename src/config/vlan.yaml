      name: USER
      subnet: 10.10.10.0/24
      gateway: 10.10.10.1
      description: "Tất cả PC phòng ban (ADMIN, SALES, ACC, IT)"
    30:
      name: IoT
      subnet: 10.10.30.0/24
      gateway: 10.10.30.1
      description: "Printer, sensor"
    35:
      name: CCTV
      subnet: 10.10.35.0/24
      gateway: 10.10.35.1
      description: "Camera an ninh"
    50:
      name: WIFI
      subnet: 10.10.50.0/24
      gateway: 10.10.50.1
      description: "WiFi users"
    99:
      name: MGMT
      subnet: 10.10.99.0/24
      gateway: 10.10.99.1
      description: "Quản trị thiết bị mạng"

  hosts:
