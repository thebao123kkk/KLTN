    - { name: NT_CUS02, ip: 10.20.50.12/24, gw: 10.20.50.1, vlan: 150 }
    - { name: NT_CUS03, ip: 10.20.50.13/24, gw: 10.20.50.1, vlan: 150 }
    # VLAN 160 IT
    - { name: NT_IT01, ip: 10.20.60.11/24, gw: 10.20.60.1, vlan: 160 }
    - { name: NT_IT02, ip: 10.20.60.12/24, gw: 10.20.60.1, vlan: 160 }
    - { name: NT_IT03, ip: 10.20.60.13/24, gw: 10.20.60.1, vlan: 160 }
    # IoT/CCTV/WIFI/VOICE
    - { name: NT_PRN01, ip: 10.20.70.11/24, gw: 10.20.70.1, vlan: 170 }
    - { name: NT_PRN02, ip: 10.20.70.12/24, gw: 10.20.70.1, vlan: 170 }
    - { name: NT_CAM01, ip: 10.20.75.11/24, gw: 10.20.75.1, vlan: 175 }
    - { name: NT_CAM02, ip: 10.20.75.12/24, gw: 10.20.75.1, vlan: 175 }
    - { name: NT_CAM03, ip: 10.20.75.13/24, gw: 10.20.75.1, vlan: 175 }
    - { name: NT_AP01, ip: 10.20.80.11/24, gw: 10.20.80.1, vlan: 180 }
