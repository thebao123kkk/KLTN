; ============================================================
; Asterisk Dialplan Config — extensions.conf
; Phase 11 — KLTN Enterprise Network
; ============================================================

[globals]
SIP_SERVER = 10.100.20.11

; ============================================================
; Context: internal — Toàn bộ extension nội bộ
; ============================================================
[internal]

; --- NT Site Extensions (2xx) ---
exten => 200,1,NoOp(Call to NT_PHN01)
exten => 200,2,Dial(SIP/NT_PHN01,30)
exten => 200,3,HangUp()

exten => 201,1,NoOp(Call to NT_PHN02)
exten => 201,2,Dial(SIP/NT_PHN02,30)
exten => 201,3,HangUp()

; --- HCM Site Extensions (3xx) ---
exten => 300,1,NoOp(Call to HCM_PHN01)
exten => 300,2,Dial(SIP/HCM_PHN01,30)
exten => 300,3,HangUp()

exten => 301,1,NoOp(Call to HCM_PHN02)
exten => 301,2,Dial(SIP/HCM_PHN02,30)
exten => 301,3,HangUp()

; --- Intercom / Test Tone ---
exten => 9999,1,Answer()
exten => 9999,2,Playback(demo-congrats)
exten => 9999,3,HangUp()

; --- Voicemail (placeholder) ---
exten => i,1,NoOp(Invalid Extension)
exten => i,2,Playback(pbx-invalid)
exten => i,3,HangUp()

exten => t,1,NoOp(Timeout)
exten => t,2,HangUp()
