; ============================================================
; Asterisk SIP Registrar Config — sip.conf
; Phase 11 — KLTN Enterprise Network
; Chạy trong namespace DC_APP01 (10.100.20.11)
; ============================================================

[general]
context=internal            ; Default context cho tất cả SIP calls
bindport=5060               ; UDP và TCP port SIP listen
bindaddr=10.100.20.11       ; Bind trực tiếp trên IP của DC_APP01
transport=udp,tcp
srvlookup=yes
videosupport=no
qualify=yes
qualifyfreq=60              ; Gửi OPTIONS mỗi 60 giây để kiểm tra trạng thái

; ---- Codec Policy ----
disallow=all
allow=ulaw                  ; G.711 PCMU (64kbps) — tiêu chuẩn thoại IP
allow=alaw                  ; G.711 PCMA (64kbps) — fallback

; ---- RTP Settings ----
rtpstart=10000              ; RTP port range bắt đầu
rtpend=20000                ; RTP port range kết thúc
dtmfmode=rfc2833

; ---- Registration ----
register => 100@10.100.20.11        ; Self registration (optional)

; ============================================================
; Chi nhánh Nha Trang — Nhân viên VoIP VLAN 190
; ============================================================
[NT_PHN01](!)
type=friend
host=dynamic
secret=nt_secret_2024
context=internal
callerid="NT-PHONE-01" <200>
qualify=yes
disallow=all
allow=ulaw
nat=force_rport,comedia

[NT_PHN01]
username=NT_PHN01
password=nt_phone01_pass

