# ============================================================
# VRRP Configuration — Gateway Redundancy
# keepalived chạy trong Mininet host namespace
# Mỗi VLAN có 1 VRRP group; VIP = x.x.x.1 của subnet
# ============================================================

# Nha Trang VRRP Groups
nhatrang:
  interface_prefix: "eth"   # interface trong mininet host
  vrrp_groups:
    - group_id: 110
      vlan: 110
      vip: 10.20.10.1
      master:  { host: NT_DIST01, ip: 10.20.10.2, priority: 110 }
      backup:  { host: NT_DIST02, ip: 10.20.10.3, priority: 100 }
      preempt: true
      advert_int: 1
    - group_id: 120
      vlan: 120
      vip: 10.20.20.1
      master:  { host: NT_DIST01, ip: 10.20.20.2, priority: 110 }
      backup:  { host: NT_DIST02, ip: 10.20.20.3, priority: 100 }
      preempt: true
      advert_int: 1
